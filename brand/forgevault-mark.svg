<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ForgeVault Holdings">
  <title>ForgeVault Holdings</title>
  <!--
    PRIMARY MARK — "Negative" (concept A3)
    Anvil knocked out of a solid forge disc. One shape, two colours: survives to 16px,
    prints in one colour, and reverses cleanly.

    THE ANVIL PATH BELOW IS THE SINGLE SOURCE OF TRUTH for every ForgeVault asset.
    It is centred on (60,60): bbox x 20..96, y 40.5..79.5 -> cy exactly 60,
    cx 58 (2 units left of centre, deliberately, so the light horn optically balances
    the heavier face and base). If this path changes, re-copy it into the icon and
    lockup files so the family stays consistent.
  -->
  <defs>
    <linearGradient id="fvForge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCC048"/>
      <stop offset=".55" stop-color="#F08430"/>
      <stop offset="1" stop-color="#C4551C"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="55" fill="url(#fvForge)"/>
  <path d="M20 48.5 C26 42.5, 34 40.5, 44 40.5 L96 40.5 L96 53.5 L78 53.5 C73 58.5, 73 62.5, 76 66.5 L86 66.5 L90 79.5 L34 79.5 L38 66.5 L48 66.5 C51 62.5, 51 58.5, 46 53.5 C36 53.5, 26 51.5, 20 48.5 Z"
        fill="#010821"/>
</svg>
